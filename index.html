<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>生态链 · EcoLoop（Demo）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    background: linear-gradient(180deg, #cfe9d6 0%, #a9dbbb 55%, #8fc9a4 100%);
    color: #2d4a35; min-height: 100vh;
    display: flex; justify-content: center; user-select: none; overflow-x: hidden;
  }
  #app { width: 100%; max-width: 470px; padding: 10px 12px 18px; display: flex; flex-direction: column; gap: 10px; }

  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 22px; letter-spacing: 1px; }
  h1 .sub { font-size: 11px; font-weight: 400; opacity: .55; margin-left: 6px; letter-spacing: 0; }
  .hbtns { display: flex; gap: 6px; }
  .iconbtn { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255,255,255,.8);
    background: rgba(255,255,255,.6); font-size: 16px; cursor: pointer; }

  #levelrow { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
  #levelbar { display: flex; gap: 5px; flex-direction: column; width: 100%; min-width: 0; }
  .navtools { display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; font-size:11px; color:#436a4b; }
  .listbtn { padding:6px 10px; border:1px solid #bad8c2; border-radius:10px; background:rgba(255,255,255,.8); color:#256b38; font-weight:700; cursor:pointer; }
  .alllevels { display:grid; grid-template-columns:repeat(auto-fit,minmax(42px,1fr)); gap:6px; max-height:55vh; overflow-y:auto; margin:12px 0 18px; padding:3px; }
  /* FR-22 选关分章:章标签页 + 单页按钮(flex-wrap 保证 360px 无溢出) */
  .chbtn { padding: 4px 10px; border-radius: 10px; border: 2px solid #cfe3d4;
    background: rgba(255,255,255,.75); font-size: 12px; font-weight: 800; cursor: pointer;
    color: #2d4a35; display: flex; align-items: center; gap: 4px; }
  .chbtn i { font-style: normal; font-size: 9px; color: #e0a52c; }
  .chbtn.cur { background: #2f8c46; color: #fff; border-color: #2f8c46; }
  .chbtn.cur i { color: #ffe08a; }
  .lvpage { display: grid; gap: 5px; width: 100%; }
  .lvbtn { min-width: 36px; padding: 5px 6px; border-radius: 10px; border: 2px solid #cfe3d4;
    background: rgba(255,255,255,.75); font-size: 13px; font-weight: 700; cursor: pointer; color: #2d4a35;
    display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
  .lvbtn span { font-size: 9px; color: #e0a52c; letter-spacing: -1px; min-height: 10px; }
  .lvbtn.cur { background: #2f8c46; color: #fff; border-color: #2f8c46; }
  .lvbtn.cur span { color: #ffe08a; }
  #lvname { font-size: 13px; font-weight: 700; color: #256b38; }

  #status { font-size: 12.5px; color: #3d5c46; background: rgba(255,255,255,.45);
    border-radius: 10px; padding: 5px 10px; text-align: center; }

  #stage { display: flex; flex-direction: column; align-items: center; }
  #mouth { width: 92px; text-align: center; font-size: 11px; color: #3d6b4c; font-weight: 700;
    background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.55));
    border: 2px solid rgba(255,255,255,.95); border-bottom: none;
    border-radius: 12px 12px 0 0; padding: 4px 0 7px; z-index: 1; }
  #bottle { padding: 12px; position: relative;
    background: linear-gradient(160deg, rgba(255,255,255,.72), rgba(255,255,255,.30));
    border: 2px solid rgba(255,255,255,.92); border-radius: 22px 22px 34px 34px;
    box-shadow: 0 12px 28px rgba(30,80,50,.18), inset 0 2px 10px rgba(255,255,255,.85); }
  #bottle::after { content: ''; position: absolute; top: 6px; left: 14%; width: 10%; height: 82%;
    background: linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,0)); border-radius: 40px;
    transform: rotate(8deg); pointer-events: none; }
  #boardwrap { position: relative; width: fit-content; }
  #board { display: grid; }
  #ents, #fx, #banner { position: absolute; inset: 0; pointer-events: none; }
  #fx { z-index: 5; } #ents { z-index: 2; } #banner { z-index: 6; }

  .cell { width: var(--cell); height: var(--cell); position: relative; border-radius: 9px;
    background: rgba(255,255,255,.30); box-shadow: inset 0 0 0 2px rgba(255,255,255,.45);
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--cell) * .44); cursor: pointer; }
  .cell:not(.stone):hover { background: rgba(255,255,255,.55); }
  .cell.stone { background: rgba(120,130,125,.30); box-shadow: inset 0 0 0 2px rgba(90,100,95,.28); cursor: default; }
  .cell.preview::after { content: var(--pe); position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--cell) * .5); opacity: .38; }
  .cell.shake { animation: shakeX .3s; }
  @keyframes shakeX { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  .entity { position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell);
    transition: transform .34s cubic-bezier(.3,1.35,.5,1), filter .4s, opacity .5s;
    will-change: transform; pointer-events: none; }
  .entity .body { position: relative; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--cell) * .58); line-height: 1;
    filter: drop-shadow(0 3px 2px rgba(0,60,30,.30)); }
  .entity.noanim { transition: none !important; }
  /* FR-19 连击慢动作：移动过渡与进食/咀嚼动画同步放慢 ×2 */
  #ents.slowmo .entity { transition-duration: .68s, .8s, 1s; }
  #ents.slowmo .entity.eaten .body { animation-duration: .84s; }
  #ents.slowmo .entity.chomp .body { animation-duration: .6s; }
  .entity.pop .body { animation: popIn .32s ease-out; }
  @keyframes popIn { from { transform: scale(.15); } 70% { transform: scale(1.18); } }
  .entity.eaten .body { animation: eatenOut .42s ease-in forwards; }
  @keyframes eatenOut { 40% { transform: scale(1.35) rotate(14deg); opacity: 1; }
                        100% { transform: scale(0) rotate(90deg); opacity: 0; } }
  .entity.chomp .body { animation: chompB .3s; }
  @keyframes chompB { 45% { transform: scale(1.22); } }
  .entity.fat { filter: drop-shadow(0 0 8px rgba(255,196,50,.95)); }
  .entity.fat .body { animation: fatPulse 1.25s ease-in-out infinite; }
  @keyframes fatPulse { 50% { transform: scale(1.13); } }
  .entity.fat .body::after { content: '✨'; position: absolute; top: calc(var(--cell) * -.03);
    right: calc(var(--cell) * .01); font-size: calc(var(--cell) * .24); }
  .entity.fly { transition: transform .85s ease-in, opacity .85s ease-in; opacity: 0; z-index: 4; }
  .entity.leave { transition: transform .8s ease-in, opacity .8s ease-in; opacity: 0; }
  .pips { position: absolute; bottom: calc(var(--cell) * .045); left: 0; right: 0;
    display: flex; justify-content: center; gap: 3px; }
  .pips i { width: calc(var(--cell) * .09); height: calc(var(--cell) * .09); border-radius: 50%;
    background: rgba(255,255,255,.8); box-shadow: inset 0 0 0 1px rgba(0,80,40,.4); }
  .pips i.on { background: #ffd75e; box-shadow: 0 0 5px rgba(255,190,40,.9); }

  .ft { position: absolute; z-index: 7; font-weight: 800; font-size: 14px; color: #237a37;
    text-shadow: 0 1px 0 #fff, 0 0 6px #fff; white-space: nowrap;
    transform: translate(-50%, 0); animation: ftUp .95s ease-out forwards; pointer-events: none; }
  @keyframes ftUp { 0% { opacity: 0; margin-top: 8px; } 25% { opacity: 1; }
                    100% { opacity: 0; margin-top: -34px; } }

  #banner { display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 900; color: #1f6d33;
    text-shadow: 0 2px 0 #fff, 0 5px 16px rgba(0,80,40,.35); opacity: 0; }
  #banner.show { animation: bannerPop 1.05s; }
  @keyframes bannerPop { 0% { opacity: 0; transform: scale(.4); }
    25% { opacity: 1; transform: scale(1.14); } 65% { transform: scale(1); opacity: 1; }
    100% { opacity: 0; transform: scale(1); } }

  /* 新规则引入卡（v0.8）：首次出现新规则的关卡，进关时弹出 */
  .panel .intro-icon { font-size: 46px; line-height: 1.1; margin: 2px 0 6px; }
  .panel .intro-tag { display: inline-block; font-size: 11px; font-weight: 800; color: #fff;
    background: #e8902a; border-radius: 10px; padding: 1px 9px; margin-bottom: 6px; }

  #hand { display: flex; gap: 12px; justify-content: center; align-items: center; min-height: 96px;
    flex-wrap: wrap; }
  .card { width: 80px; padding: 9px 6px 7px; background: linear-gradient(170deg, #ffffff, #edf6ef);
    border: 2px solid #cfe3d4; border-radius: 15px; display: flex; flex-direction: column;
    align-items: center; gap: 3px; cursor: pointer; position: relative;
    box-shadow: 0 4px 10px rgba(30,80,50,.14); transition: .16s; }
  .card .ce { font-size: 36px; line-height: 1.05; }
  .card .cn { font-size: 12px; color: #4a6b52; font-weight: 700; }
  .card .cx { position: absolute; top: -8px; right: -8px; background: #2f8c46; color: #fff;
    font-size: 11px; font-weight: 800; border-radius: 10px; padding: 1px 7px;
    box-shadow: 0 2px 5px rgba(20,80,40,.3); }
  .card.sel { border-color: #ffb42e; background: linear-gradient(170deg, #fffbea, #fff2cc);
    box-shadow: 0 7px 18px rgba(255,170,40,.4); transform: translateY(-5px); }
  .card:not(.sel):not(.lock):hover { transform: translateY(-2px); }
  /* FR-17 固定顺序：非队首牌禁用 + 序号角标 */
  .card.lock { opacity: .5; filter: grayscale(.6); cursor: not-allowed; }
  .card .cq { position: absolute; top: -8px; left: -8px; background: #ffb42e; color: #fff;
    font-size: 13px; font-weight: 800; border-radius: 50%; width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 5px rgba(160,100,20,.3); }
  .card.lock .cq { background: #9bb0a1; }
  .nocard { font-size: 13px; color: #6b8172; }

  #controls { display: flex; gap: 10px; justify-content: center; }
  .btn { padding: 9px 18px; border-radius: 13px; border: 2px solid #cfe3d4; background: #fff;
    font-size: 14px; font-weight: 700; cursor: pointer; color: #2d4a35; transition: .15s; }
  .btn:disabled { opacity: .38; cursor: default; }
  .btn.primary { background: #2f8c46; color: #fff; border-color: #2f8c46; }
  .btn:not(:disabled):hover { transform: translateY(-1px); }

  footer { text-align: center; font-size: 10.5px; color: rgba(40,70,50,.5); }

  #modal { position: fixed; inset: 0; background: rgba(18,45,28,.5); display: none;
    align-items: center; justify-content: center; z-index: 50; backdrop-filter: blur(2px); }
  #modal.show { display: flex; }
  .panel { background: #fdfefc; border-radius: 20px; padding: 22px 24px; max-width: 330px; width: 88%;
    text-align: center; box-shadow: 0 20px 50px rgba(0,40,20,.4); animation: panelIn .25s ease-out;
    max-height: 82vh; overflow-y: auto; }
  @keyframes panelIn { from { transform: scale(.8); opacity: 0; } }
  .panel h2 { font-size: 20px; color: #1f6d33; margin-bottom: 8px; }
  .panel .stars { font-size: 36px; letter-spacing: 5px; margin: 4px 0; color: #f2b12c; }
  .panel p { font-size: 13px; color: #5a7263; margin-bottom: 16px; line-height: 1.7; text-align: left; }
  .panel p.tc { text-align: center; }
  .panel .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  #toast { position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%);
    background: rgba(28,58,38,.88); color: #fff; padding: 9px 18px; border-radius: 13px;
    font-size: 13px; opacity: 0; transition: opacity .25s; z-index: 60; pointer-events: none;
    white-space: nowrap; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>生态链<span class="sub">EcoLoop · 瓶中食物链</span></h1>
    <div class="hbtns">
      <button id="soundBtn" class="iconbtn" title="音效开关">🔊</button>
      <button id="helpBtn" class="iconbtn" title="玩法说明">❓</button>
    </div>
  </header>

  <div id="levelrow">
    <div id="levelbar"></div>
    <div id="lvname"></div>
  </div>

  <div id="status"></div>

  <div id="stage">
    <div id="mouth">🕊️ 放归口</div>
    <div id="bottle">
      <div id="boardwrap">
        <div id="board"></div>
        <div id="ents"></div>
        <div id="fx"></div>
        <div id="banner"></div>
      </div>
    </div>
  </div>

  <div id="hand"></div>

  <div id="controls">
    <button id="undoBtn" class="btn">↩ 悔一步</button>
    <button id="restartBtn" class="btn">🔄 重开本关</button>
  </div>

  <footer>生态链 · EcoLoop Demo v0.14 · 乐信圣文 AI 休闲游戏创作大赛 · 单文件离线可玩</footer>
</div>

<div id="modal"><div class="panel" id="panelBox"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ============================================================
 * 生态链 · EcoLoop —— 玩法核心（v0.14 Demo，50 关）
 * v0.11（2026-11-14）：E组L21–L30入库，fixed×2/6×6×3/等待草/首步5连；回放留150ms绘制余量。
 * v0.10（开发计划阶段 D）：D 组 L12–L20「结构九式」入库（intro 新卡×3：吃饱卡位 /
 *       你放的鹰 / 草的义务豁免；theme:'D' 分章）；盘面经 D组候选_v1~v18 迭代 +
 *       求解器逐关验证 optimal==par，解数/节点台账见《EcoLoop_关卡台账.md》
 * v0.9（开发计划阶段 0，对应《EcoLoop_12-50关开发计划.md》）：FR-22 选关分章分页
 *       （levelbar 章标签 + 分页，50 关 360px 可用）；FR-27 关卡元数据 theme（非玩法
 *       字段，仅选关 UI 读取）；FR-19 慢动作自适应（≥4 连「落牌+回放+横幅」≤4s）；
 *       newGameState 支持预置 fat/fatSince（L15 前置，纯初始化层，引擎零改动）
 * v0.8（对应 SPEC v1.7 / UI 调整）：取消「有用格」橙色呼吸描边；去掉盘面下方提示条（tip 文案
 *       保留在关卡数据中，不再渲染）；新增「新规则引入卡」LevelDef.intro（L4 石头 / L5 鹰吃兔 /
 *       L11 固定顺序），进关弹出、重开不重复
 * v0.7（对应 SPEC v1.6 / M3-1、M3-2）：FR-19 连击慢动作（≥4 连事件间隔 ×2 + 进食音按大调
 *       音阶递进，横幅「超级连锁」）；静音偏好持久化（eatfly_muted，读写 try/catch 降级）
 * v0.6（对应 SPEC v1.5 / M2）：FR-17 固定手牌顺序——LevelDef.order/seq、GameState.queue；
 *       canPlay/takeCard 统一出牌判定（交互/自检/求解器共用，resolve 不感知顺序）；
 *       试点关 L11「照谱做菜」+ U25（?test 23 条 / 11 关）

 *       U01–U16 与 U24（?test 22 条；harness 增 settle / repeat / 预置 fatSince）
 * v0.4（对应 SPEC v1.3）：C 组 L6–10（谁先吃 / 窄口沙漏 / 浪费的诱惑 / 鹰的餐桌 /
 *       一步起飞）+ 胜利判定修复：草不计入（对齐 §3.4 FAQ，v0.2 起未吃的草会误阻断胜利）
 * v0.3（玩法 v2.2 多猎物）：prey 改列表，鹰同时吃「狐+兔」；猎物偏好键
 *       「吃饱 > 营养级 > 阅读序」；L5 因鹰抢食肥兔重设计（par 2→3）
 * 规则：放牌 → 「开饭循环」结算（鹰→狐→兔，各吃一口、走到猎物格；
 *       刚吃饱的猎物会被相邻天敌当场吃掉——即时连锁）→ 吃饱/离开
 * 胜利：盘面上所有动物离场（被吃掉，或吃饱后离开）
 * ============================================================ */

/* ---------- 基础数据 ---------- */
/* prey：猎物列表（v2.2 多猎物——鹰同时吃狐与兔）；tier：营养级（草0<兔1<狐2<鹰3），

const DIRS  = [[-1,0],[1,0],[0,-1],[0,1]];     // 上下左右四邻

      {

    ],

/* ---------- 音效（WebAudio 合成，无素材） ---------- */
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f0, f1, dur, type, vol, delay) {
  if (muted) return;
  const a = ac(); if (!a) return;
  try {
    const t = a.currentTime + (delay || 0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol || .12, t);
    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + .05);
  } catch (e) {}
}

/* ---------- 工具 ---------- */
/* FR-17：fixed 关的手牌计数由 seq 推出（单一来源，避免 hand 与 seq 不一致） */
function handOf(seq) {
  const h = {};
  for (const sp of seq) h[sp] = (h[sp] || 0) + 1;
  return h;
}
function newGameState(i) {
  const L = LEVELS[i];
  const fixed = L.order === 'fixed';
  return {
    lv: i, w: L.w, h: L.h, stones: (L.stones || []).map(s => s.slice()),
    animals: L.animals.map(d => ({
      id: idSeq++, species: d.sp, r: d.r, c: d.c,
      satiety: d.sat || 0,
      /* L15 预置 fat(开发计划 §3.2 技术注):可选 fat/fatSince,纯初始化层扩展——
       * 引擎用例 harness 的 d.fs 同款语义;不触碰 computeResolution/判定链 */
      fat: !!d.fat, fatSince: d.fatSince === undefined ? -1 : d.fatSince,
      dead: false
    })),
    hand: fixed ? handOf(L.seq) : Object.assign({}, L.hand),
    queue: fixed ? L.seq.slice() : null,       // FR-17：剩余出牌队列（free 关为 null）
    used: 0, released: 0, turn: 0, history: []
  };
}
const isStone  = (r, c) => S.stones.some(s => s[0] === r && s[1] === c);
const entityAt = (r, c) => S.animals.find(a => !a.dead && a.r === r && a.c === c) || null;
const handCount = () => Object.values(S.hand).reduce((x, n) => x + n, 0);
/* FR-17：能否出这张牌——fixed 关只能出队首（顺序只在交互层，computeResolution 不感知） */
const canPlay = sp => S.hand[sp] > 0 && (!S.queue || S.queue[0] === sp);
/* 消耗一张牌（placeCard / 自检 / 求解器共用，保证三处语义一致） */
function takeCard(sp) {
  S.hand[sp]--;
  if (S.queue) S.queue.shift();
  S.used++; S.turn++;
}
/* 胜利判定（v0.4 对齐 §3.4 FAQ「剩下的草」）：所有「动物」离场或吃饱；
 * 草是静态实体、无归宿义务，不计入——v0.2~v0.3 曾把未吃的草算作未达成，属实现 bug */
const allSettled = () => S.animals.every(a => a.dead || a.fat || a.species === 'grass');
/* 可放置格：非石头、无存活实体 */
function emptyCells() {
  const out = [];
  for (let r = 0; r < S.h; r++) for (let c = 0; c < S.w; c++)
    if (!isStone(r, c) && !entityAt(r, c)) out.push([r, c]);
  return out;
}
/* 失败判定（§3.4-3/4，须在胜利判定与离开结算之后调用）：
 * 'hand' = 手牌用尽；'full' = 手牌 > 0 但瓶子里已无可放格（盘满保护）；null = 继续 */
function loseReason() {
  if (handCount() === 0) return 'hand';
  if (!emptyCells().length) return 'full';
  return null;
}

/* ============================================================
 * 结算（核心算法，纯逻辑、零随机、完全确定）
 * 每次放置后进入「开饭循环」：每轮鹰→狐→兔各吃一口相邻猎物
 * 并走到猎物格；吃「吃饱」猎物 +2；吃饱立刻生效（发光）。
 * 只要一轮里有人吃到东西就再来一轮——刚吃饱的猎物会在下一轮
 * 被相邻天敌当场吃掉，形成即时连锁，直到一轮无人进食。
 * 吃饱满一整回合未被吃掉的（旁边没有天敌）→ 回合末离开。
 * ============================================================ */
// Same species compete by satiety. Preserve other species' reading-order slots.
function predatorOrder(group) {
  const ordered=S.animals.filter(a=>!a.dead&&!a.fat&&group.includes(a.species)).sort((a,b)=>a.r-b.r||a.c-b.c);
  const queues=new Map(group.map(sp=>[sp,ordered.filter(a=>a.species===sp).sort((a,b)=>b.satiety-a.satiety||a.r-b.r||a.c-b.c)]));
  return ordered.map(a=>queues.get(a.species).shift());
}
function computeResolution(turn) {
  const events = [];
  while (true) {
    let ate = 0;
    for (const group of ORDER) {
      // 同级按盘面阅读序（从上到下、从左到右）
      const preds = predatorOrder(group);
      for (const p of preds) {
        if (p.dead || p.fat) continue;             // 可能已被更高级捕食者吃掉，或已吃饱
        const sp = p.species;
        const preys = DIRS.map(d => [p.r + d[0], p.c + d[1]])
          .filter(pos => pos[0] >= 0 && pos[0] < S.h && pos[1] >= 0 && pos[1] < S.w)
          .map(pos => entityAt(pos[0], pos[1]))
          .filter(e => e && SPECIES[sp].prey.includes(e.species));
        if (!preys.length) continue;
        // 猎物偏好（v2.2 多猎物）：吃饱（一口顶两口）> 营养级（狐>兔）> 阅读序
        preys.sort((a, b) => (b.fat ? 1 : 0) - (a.fat ? 1 : 0)
                        || SPECIES[b.species].tier - SPECIES[a.species].tier
                        || a.r - b.r || a.c - b.c);
        const prey = preys[0];
        prey.dead = true;
        const gain = prey.fat ? 2 : 1;
        p.satiety += gain;
        p.r = prey.r; p.c = prey.c;                // 吃完走到猎物的格子
        events.push({ type: 'eat', pred: p.id, prey: prey.id, gain,
                      preyFat: !!prey.fat, to: { r: p.r, c: p.c } });
        ate++;
        if (!p.fat && p.satiety >= SPECIES[sp].need) {
          p.fat = true; p.fatSince = turn;         // 吃饱立刻生效，当场就可能被天敌接走
          events.push({ type: 'fat', id: p.id });
        }
      }
    }
    if (!ate) break;                               // 无人进食 → 连锁结束
  }
  // 吃饱满一整回合且未被吃掉的，回合末离开（由调用方在胜利判定后执行）
  const flies = S.animals.filter(a => !a.dead && a.fat && a.fatSince >= 0 && a.fatSince < turn)
                         .map(a => a.id);
  return { events, flies };
}

/* ---------- 渲染 ---------- */
function computeCell() {
  const bw = Math.min(window.innerWidth, 470) - 56;
  CELL = Math.max(38, Math.min(66, Math.floor(bw / S.w)));
  document.documentElement.style.setProperty('--cell', CELL + 'px');
}

function pipHTML(a) {
  const need = SPECIES[a.species].need;
  if (!need) return '';
  let s = '';
  for (let i = 0; i < need; i++) s += `<i class="${i < Math.min(a.satiety, need) ? 'on' : ''}"></i>`;
  return `<div class="pips">${s}</div>`;
}

function createEntityEl(a, pop) {
  const el = document.createElement('div');
  el.className = 'entity ' + a.species + (a.fat ? ' fat' : '');
  el.innerHTML = `<div class="body"><span>${SPECIES[a.species].emoji}</span>${pipHTML(a)}</div>`;
  if (pop) el.classList.add('pop');
  el.style.transform = `translate(${a.c * CELL}px, ${a.r * CELL}px)`;
  entsEl.appendChild(el);
  elMap[a.id] = el;
  if (pop) setTimeout(() => el.classList.remove('pop'), 360);
}

function setEntityPos(el, r, c) { el.style.transform = `translate(${c * CELL}px, ${r * CELL}px)`; }

/* sat 缺省取终态；演出回放时传入「本事件发生后」的逐步饱食（v0.8 修复：先算后演导致首口就显示终态） */
function updatePips(id, sat) {
  const a = S.animals.find(x => x.id === id);
  const el = elMap[id];
  if (a && el) {
    const p = el.querySelector('.pips');
    if (p) p.outerHTML = pipHTML(sat === undefined ? a : { ...a, satiety: sat });
  }
}

function renderBoard() {
  boardEl.style.gridTemplateColumns = `repeat(${S.w}, var(--cell))`;
  boardEl.style.width = `calc(${S.w} * var(--cell))`;
  boardEl.style.height = `calc(${S.h} * var(--cell))`;
  boardEl.innerHTML = '';
  for (let r = 0; r < S.h; r++) for (let c = 0; c < S.w; c++) {
    const cell = document.createElement('div');
    cell.className = 'cell' + (isStone(r, c) ? ' stone' : '');
    cell.dataset.r = r; cell.dataset.c = c;
    if (isStone(r, c)) cell.textContent = '🪨';
    boardEl.appendChild(cell);
  }
}

const QNUM = '①②③④⑤⑥⑦⑧⑨⑩';
function renderHand() {
  // FR-17 fixed：按队列逐张排开，选中态锁定队首，其余禁用 + 序号角标
  if (S.queue) {
    sel = S.queue[0] || null;
    handEl.innerHTML = '';
    S.queue.forEach((sp, i) => {
      const d = document.createElement('div');
      d.className = 'card' + (i === 0 ? ' sel' : ' lock');
      d.dataset.sp = sp; d.dataset.qi = i;
      d.innerHTML = `<span class="ce">${SPECIES[sp].emoji}</span><span class="cn">${SPECIES[sp].name}</span><span class="cq">${QNUM[i] || i + 1}</span>`;
      handEl.appendChild(d);
    });
    if (!S.queue.length) handEl.innerHTML = '<div class="nocard">牌用完了…</div>';
    return;
  }
  // 自动选牌：只剩一种时默认选中
  if (!sel || !(S.hand[sel] > 0)) {
    sel = null;
    for (const k of Object.keys(S.hand)) if (S.hand[k] > 0) { sel = k; break; }
  }
  handEl.innerHTML = '';
  let any = false;
  for (const sp of Object.keys(S.hand)) {
    const n = S.hand[sp];
    if (n <= 0) continue;
    any = true;
    const d = document.createElement('div');
    d.className = 'card' + (sel === sp ? ' sel' : '');
    d.dataset.sp = sp;
    d.innerHTML = `<span class="ce">${SPECIES[sp].emoji}</span><span class="cn">${SPECIES[sp].name}</span><span class="cx">×${n}</span>`;
    handEl.appendChild(d);
  }
  if (!any) handEl.innerHTML = '<div class="nocard">牌用完了…</div>';
}

function renderStatus() {
  statusEl.textContent =
    `🃏 剩 ${handCount()} 张 · 🕊️ 放归 ${S.released} 只 · 已用 ${S.used} 张（本关最少 ${LEVELS[S.lv].par} 张）`;
}

/* FR-22 选关分章(50 关 360px 可用):按「连续同 theme」分章,theme 缺省=「基础」(1–11);
 * theme 是 FR-27 的非玩法元数据,仅选关 UI 读取,引擎/求解器不感知 */
function levelButton(i) {
  return '<button class="lvbtn'+(i===S.lv?' cur':'')+'" data-lv="'+i+'" aria-label="第'+(i+1)+'关，'+(prog[i]||0)+'星">'+(i+1)+'<span>'+'★'.repeat(prog[i]||0)+'</span></button>';
}
function renderLevelbar() {
  const columns=Math.max(1,Math.floor(((levelbarEl.clientWidth||320)+5)/41));
  const start=Math.max(0,(Math.floor(S.lv/columns)-1)*columns),end=Math.min(LEVELS.length,start+columns*2);
  levelbarEl.innerHTML='<div class="navtools"><span>第 '+(start+1)+'—'+end+' 关 / 共 '+LEVELS.length+' 关</span><button id="levelListBtn" class="listbtn"'+(busy?' disabled':'')+'>☷ 关卡列表</button></div><div class="lvpage" style="grid-template-columns:repeat('+columns+',minmax(0,1fr))">'+LEVELS.slice(start,end).map((_,j)=>levelButton(start+j)).join('')+'</div>';
  lvnameEl.textContent='第 '+(S.lv+1)+' 关 · '+LEVELS[S.lv].name;
}
function showLevelList() {
  if(busy)return;
  showModal('<h2>关卡列表</h2><div class="alllevels">'+LEVELS.map((_,i)=>levelButton(i)).join('')+'</div><div class="row"><button class="btn" id="closeLevelList">关闭</button></div>');
  $('closeLevelList').onclick=hideModal;
  panelBox.querySelectorAll('[data-lv]').forEach(btn=>btn.onclick=()=>{if(busy)return;const i=+btn.dataset.lv;hideModal();loadLevel(i);});
}

function renderControls() {
  undoBtn.disabled = busy || !S.history.length;
  restartBtn.disabled = busy;
}

/* v0.8 起取消「有用格」呼吸描边高亮（橙框闪动干扰读盘，且等于把解法递到手上）；仅保留悬停预览 */
function clearPreviews() {
  boardEl.querySelectorAll('.preview').forEach(el => el.classList.remove('preview'));
}

function renderAll() {
  elMap = {};
  renderBoard();
  entsEl.innerHTML = ''; fxEl.innerHTML = '';
  bannerEl.classList.remove('show'); bannerEl.textContent = '';
  for (const a of S.animals) if (!a.dead) createEntityEl(a, false);
  renderHand(); renderStatus(); renderLevelbar(); renderControls();
  hideModal(); clearPreviews();
}

/* ---------- 小组件 ---------- */
let toastTimer = null, bannerTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
}
function showBanner(text) {
  bannerEl.textContent = text;
  bannerEl.classList.remove('show');
  void bannerEl.offsetWidth;
  bannerEl.classList.add('show');
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => { bannerEl.classList.remove('show'); bannerEl.textContent = ''; }, 1100);
}
function floatText(r, c, text) {
  const el = document.createElement('div');
  el.className = 'ft';
  el.textContent = text;
  el.style.left = (c * CELL + CELL / 2) + 'px';
  el.style.top = (r * CELL) + 'px';
  fxEl.appendChild(el);
  setTimeout(() => el.remove(), 950);
}
function shake(cell) {
  cell.classList.add('shake');
  setTimeout(() => cell.classList.remove('shake'), 320);
}
function showModal(html) { panelBox.innerHTML = html; modalEl.classList.add('show'); }
function hideModal() { modalEl.classList.remove('show'); }

/* ---------- 动画演出 ---------- */
/* FR-19 连击慢动作：先算后演——一次结算的 eat 数 ≥ min 时，事件回放间隔 × factor，
 * 进食音按大调音阶随连击序号递进。只影响演出节奏，不影响结算结果。
 * v0.9（开发计划 §2.3「单次结算回放 ≤4s」红线）：慢动作倍率改为自适应——按
 * 「落牌 300 + 事件回放 + 横幅 450 ≤ 4000ms」倒推 eat 间隔倍率（1.05–2）；
 * CSS .slowmo 的移动/进食动画仍 ×2（慢动作观感由动画承担）；
 * fat 事件是状态闪现而非位移，慢动作档固定 240ms（eat ≥6 时归零赶 crescendo） */
const COMBO_SLOW = { min: 4, maxFactor: 2, minFactor: 1.05 };
const EV_MS = { eat: 470, fat: 430 };             // 默认事件间隔（<4 连，与 v0.8 一致）
const FAT_SLOW_MS = 240;                          // 慢动作档 fat 间隔
const comboSlow = events => {
  const eats = events.filter(e => e.type === 'eat').length;
  if (eats < COMBO_SLOW.min) return 1;
  const fats = events.length - eats;
  const fatMs = eats >= 6 ? 0 : FAT_SLOW_MS;
  const budget = 3850 - 300 - 450 - fats * fatMs; // 给浏览器定时器/绘制留150ms余量，实测回放≤4s
  return Math.min(COMBO_SLOW.maxFactor,
    Math.max(COMBO_SLOW.minFactor, budget / (eats * EV_MS.eat)));
};
const SCALE = [1, 9/8, 5/4, 4/3, 3/2, 5/3, 15/8, 2];  // 大调音阶（do re mi fa sol la si do'）

async function animateEvent(ev, slow = 1, step = 0, shown = null, fatMs = EV_MS.fat) {
  if (ev.type === 'eat') {
    const preyEl = elMap[ev.prey];
    const predEl = elMap[ev.pred];
    if (preyEl) {
      preyEl.classList.add('eaten');
      setTimeout(() => preyEl.remove(), 460 * slow);
      delete elMap[ev.prey];
    }
    sndEat(slow > 1 ? SCALE[Math.min(step, SCALE.length - 1)] : 1);
    if (predEl) {
      setEntityPos(predEl, ev.to.r, ev.to.c);
      predEl.classList.add('chomp');
      setTimeout(() => predEl.classList.remove('chomp'), 320 * slow);
    }
    if (shown) { shown[ev.pred] += ev.gain; updatePips(ev.pred, shown[ev.pred]); }
    else updatePips(ev.pred);
    floatText(ev.to.r, ev.to.c, (ev.preyFat ? '饱！+' : '+') + ev.gain);
    await wait(EV_MS.eat * slow);
  } else if (ev.type === 'fat') {
    const el = elMap[ev.id];
    const a = S.animals.find(x => x.id === ev.id);
    if (el) el.classList.add('fat');
    if (a) floatText(a.r, a.c, '吃饱！');
    sndFat();
    await wait(fatMs);                             // v0.9:慢动作档用固定 240ms(见 comboSlow 注)
  }
}

function flyEl(a) {                                 // 胜利演出：飞向瓶口
  const el = elMap[a.id];
  if (!el) return;
  el.classList.add('fly');
  const x = (S.w * CELL) / 2 - CELL / 2;
  el.style.transform = `translate(${x}px, ${-CELL * 1.25}px) scale(1.35)`;
  setTimeout(() => el.remove(), 900);
  delete elMap[a.id];
}
function fadeEl(a) {                                // 无人来吃：渐变消失，悄悄离开
  const el = elMap[a.id];
  if (!el) return;
  el.classList.add('leave');
  el.style.transform = `translate(${a.c * CELL}px, ${(a.r - 0.6) * CELL}px) scale(.82)`;
  setTimeout(() => el.remove(), 850);
  delete elMap[a.id];
}

async function doFlies(ids) {
  for (const id of ids) {
    const a = S.animals.find(x => x.id === id);
    if (!a || a.dead) continue;
    a.dead = true; S.released++;
    floatText(a.r, a.c, '🕊️ 悄悄溜走');
    fadeEl(a);
    sndFly();
    await wait(180);
  }
  await wait(560);
  renderStatus();
}

/* ---------- 放牌主流程 ---------- */
async function placeCard(sp, r, c) {
  busy = true; renderControls(); clearPreviews();
  // 快照（悔一步用）
  S.history.push(JSON.stringify({
    animals: S.animals, hand: S.hand, queue: S.queue, used: S.used, released: S.released, turn: S.turn
  }));
  if (S.history.length > 80) S.history.shift();

  takeCard(sp);
  const ent = { id: idSeq++, species: sp, r, c, satiety: 0, fat: false, fatSince: -1, dead: false };
  S.animals.push(ent);
  createEntityEl(ent, true);
  renderHand(); renderStatus();
  sndPlace();
  await wait(300);

  // 先算后演：结算前记下各动物饱食，回放时逐事件累加 gain，饱食点按「当时」显示而非终态
  const shown = {};
  for (const a of S.animals) shown[a.id] = a.satiety;
  const { events, flies } = computeResolution(S.turn);
  const slow = comboSlow(events);                   // FR-19：先算后演，≥4 连进入（自适应）慢动作
  if (slow > 1) entsEl.classList.add('slowmo');
  const fatMs = slow > 1
    ? (events.filter(e => e.type === 'eat').length >= 6 ? 0 : FAT_SLOW_MS)
    : EV_MS.fat;
  let step = 0;
  for (const ev of events) await animateEvent(ev, slow, ev.type === 'eat' ? step++ : step, shown, fatMs);
  entsEl.classList.remove('slowmo');

  const eats = events.filter(e => e.type === 'eat').length;
  if (eats >= 2) { showBanner(`${slow > 1 ? '超级' : ''}连锁 ×${eats}！`); await wait(450); }

  // 胜利判定：所有动物离场或吃饱（吃饱=即将离开，视为达成）；草不计入（§3.4 FAQ，v0.4 修复）
  const win = allSettled();
  if (win) { await doVictory(); return; }

  if (flies.length) await doFlies(flies);

  // 失败判定（§3.4 顺序：胜利 → 离开 → 手牌尽 → 盘满）
  const why = loseReason();
  if (why) { doLose(why); return; }
  busy = false; renderControls();
}

async function doVictory() {
  sndWin();
  showBanner('🎉 通关成功！');
  const alive = S.animals.filter(a => !a.dead);
  for (const a of alive) { a.dead = true; S.released++; flyEl(a); sndFly(); await wait(150); }
  await wait(850);
  const stars = calcStars();
  if ((prog[S.lv] || 0) < stars) {
    prog[S.lv] = stars;
    try { localStorage.setItem('eatfly_stars', JSON.stringify(prog)); } catch (e) {}
  }
  renderLevelbar();
  const last = S.lv === LEVELS.length - 1;
  showModal(`
    <h2>🎉 通关成功！</h2>
    <div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
    <p class="tc">用牌 ${S.used} 张（最少 ${LEVELS[S.lv].par}）· 放归 ${S.released} 只小家伙</p>
    <div class="row">
      <button class="btn" id="mReplay">再玩一次</button>
      ${last ? '' : '<button class="btn primary" id="mNext">下一关 →</button>'}
    </div>`);
  $('mReplay').onclick = () => loadLevel(S.lv);
  if (!last) $('mNext').onclick = () => loadLevel(S.lv + 1);
}

function doLose(why) {
  sndLose();
  const msg = why === 'full'
    ? `<h2>🫙 瓶子满了…</h2>
    <p class="tc">手里还有牌，可瓶子里已经没有空格能放了。<br>
    想想：哪张牌占了位置却没被吃掉？</p>`
    : `<h2>😵 还有小家伙没吃饱…</h2>
    <p class="tc">牌用完了，盘面上还有动物没离场。<br>
    想想：它吃饱的位置对不对？旁边有没有能吃它的天敌？</p>`;
  showModal(`
    ${msg}
    <div class="row">
      ${S.history.length ? '<button class="btn" id="mUndo">↩ 悔一步</button>' : ''}
      <button class="btn primary" id="mRetry">重新开始</button>
    </div>`);
  const u = $('mUndo');
  if (u) u.onclick = () => undo(true);
  $('mRetry').onclick = () => loadLevel(S.lv);
}

function calcStars() {
  const par = LEVELS[S.lv].par;
  if (S.used <= par) return 3;
  if (S.used <= par + 1) return 2;
  return 1;
}

/* ---------- 悔一步 / 选关 ---------- */
function undo(force) {
  if (!S.history.length) return;
  if (busy && !force) return;
  const s = JSON.parse(S.history.pop());
  S.animals = s.animals; S.hand = s.hand; S.queue = s.queue || null; S.used = s.used;
  S.released = s.released; S.turn = s.turn;
  busy = false; sel = null;
  renderAll();
}

const LEVEL_GUIDES = {
0:{icon:'🌱',title:'欢迎来到生态链',text:'先点下方手牌，再点棋盘空格放置。<br><br>动物自动吃上下左右相邻的食物，并走到食物格；斜角吃不到。一次放置可能引发连续进食。<br><br>小圆点表示饱食度，填满就吃饱。普通食物加1，吃饱的动物作为食物加2。让所有动物吃饱或离场即可通关，草和剩余手牌不用清空。<br><br>先给兔子喂草吧！放错可以点“悔一步”。'},
3:{icon:'🐇',title:'同类竞争：谁先吃？',text:'两只同类动物都能吃同一份食物时，尚未吃饱且饱食度更高的先行动。<br><br>饱食度相同，先上后下；同一行先左后右。已经吃饱的动物不再进食。<br><br>这里比较两只捕食者的行动顺序，不是挑选更饱的猎物。不同物种之间不按饱食度争先。'},
8:{icon:'🦊',title:'选食顺序：吃哪一只？',text:'同一只动物有多个相邻食物时：<br><br>① 优先吃已经吃饱的猎物。<br>② 饱食状态相同，优先吃食物链层级更高的猎物，例如鹰先选狐或蛙，再选兔。<br>③ 再相同，先上后下，同一行先左后右。<br><br>狐狸旁边两只兔子都没吃饱，即使一只吃过1口、另一只0口，也按位置选择。只有“已经吃饱”才有优先权。'}
};

function loadLevel(i) {
  const entering = !S || S.lv !== i;               // 重开/再玩本关不重复弹规则卡
  S = newGameState(i);
  busy = false; sel = null;
  try { localStorage.setItem('eatfly_last', String(i)); } catch (e) {}
  computeCell();
  renderAll();
  const guide = LEVEL_GUIDES[i] || LEVELS[i].intro;

/* ---------- T1 引擎单元用例（v2.2 多猎物；?test 时先于关卡自检运行） ----------
 * 覆盖三条裁决：鹰吃兔（多猎物基础）/ 混合猎物偏好（吃饱>营养级>阅读序）/
 * 鹰抢狐的肥兔（鹰先结算 + 吃饱优先 ⇒ 原 L5 解法被截胡，留作回归样本）。
 * 每条 = 前置盘面 → 操作（放置）→ 期望（events 摘要 + 关键终态）。 */
/* 断言小工具：事件摘要 'eat:pred>prey+gain' / 'fat:id'；新放置实体（非预置）列表 */
const evSig = ev => ev.map(e => e.type === 'eat' ? `eat:${e.pred}>${e.prey}+${e.gain}` : `fat:${e.id}`).join(',');
const placedOf = A => S.animals.filter(a => !A.includes(a));
const at = (a, r, c) => a.r === r && a.c === c;

/* U03 / U16 共用：即时连锁（兔吃饱 → 狐当场吃肥兔 → 狐吃饱，同一次放置内） */
const CASE_U03_BOARD = { w: 4, h: 4, stones: [],
  animals: [ { sp: 'fox', r: 2, c: 2, sat: 1 }, { sp: 'rabbit', r: 1, c: 1, sat: 1 } ] };
function checkU03(runs, A) {
  const [fox, rabbit] = A, [grass] = placedOf(A), f = [];
  const want = `eat:${rabbit.id}>${grass.id}+1,fat:${rabbit.id},eat:${fox.id}>${rabbit.id}+2,fat:${fox.id}`;
  if (runs.length !== 1) f.push('应只有 1 次放置');
  if (evSig(runs[0].events) !== want) f.push(`事件应为 [${want}]，实得 [${evSig(runs[0].events)}]`);
  if (!rabbit.dead) f.push('兔应 dead');
  if (!fox.fat || fox.satiety !== 3 || !at(fox, 2, 1)) f.push('狐终态应为 3/3 fat @ (2,1)');
  return f;
}

/* 跑一条引擎用例：纯引擎、零 DOM；返回失败列表（空 = 通过）
 * 用例选项（v0.5 / M1-2）：
 *   board.animals[i].fat / fs —— 预置吃饱态与 fatSince（U09 离开时机需要）
 *   settle: true —— 与 placeCard 同语义：每放一张先做胜利判定（runs[i].win），
 *                   非胜才结算 leaves（dead + released），胜则停止后续放置
 *   repeat: N   —— 同一用例从同一初始态重跑 N 次，events 与终态须逐字节全等（U16）
 *   seq: [...]  —— 固定顺序手牌（FR-17，替代 hand）；队首外的牌放置即判非法 */
function runEngineCase(cs) {
  const savedS = S, savedId = idSeq;
  const B = cs.board;
  function once() {
    idSeq = savedId;                         // 每次重跑 id 序列一致（确定性比对的前提）
    S = {
      lv: 0, w: B.w, h: B.h, stones: (B.stones || []).map(s => s.slice()),
      animals: B.animals.map(d => ({ id: idSeq++, species: d.sp, r: d.r, c: d.c,
        satiety: d.sat || 0, fat: !!d.fat, fatSince: d.fs === undefined ? -1 : d.fs, dead: false })),
      hand: cs.seq ? handOf(cs.seq) : Object.assign({}, cs.hand),
      queue: cs.seq ? cs.seq.slice() : null, used: 0, released: 0, turn: 0, history: []
    };
    const A = S.animals.slice();             // 预置动物引用（断言用）
    const runs = [];
    let legal = true;
    for (const [sp, r, c] of cs.moves) {
      if (!canPlay(sp) || isStone(r, c) || entityAt(r, c)) { legal = false; break; }
      takeCard(sp);
      S.animals.push({ id: idSeq++, species: sp, r, c, satiety: 0, fat: false, fatSince: -1, dead: false });
      const res = computeResolution(S.turn);
      runs.push(res);
      if (cs.settle) {
        res.win = allSettled();
        if (res.win) break;                  // 胜利 → 演出，后续不再放置
        for (const id of res.flies) {        // 胜利判定后才结算离开
          const a = S.animals.find(x => x.id === id);
          if (a) { a.dead = true; S.released++; }
        }
      }
    }
    return { A, runs, legal };
  }
  let fails = [];
  let out = once();
  if (out.legal && cs.repeat) {
    const sig = JSON.stringify({ runs: out.runs, animals: S.animals });
    for (let k = 1; k < cs.repeat; k++) {
      out = once();
      if (JSON.stringify({ runs: out.runs, animals: S.animals }) !== sig) {
        fails.push(`第 ${k + 1} 次重跑结果与首次不一致（确定性破坏）`); break;
      }
    }
  }
  if (!out.legal) fails = ['放置非法（牌不足/石头/占用）'];
  else if (!fails.length) {
    try { fails = cs.check(out.runs, out.A) || []; }
    catch (e) { fails = ['断言异常：' + (e && e.message || e)]; }
  }
  S = savedS; idSeq = savedId;
  return fails;
}

/* ---------- 自检（打开 ...?test：先跑 T1 引擎用例，再跑 T2 关卡标准解） ---------- */
function runSelfTest() {
  const saved = S;
  const lines = [];
  let caseOK = 0;
  for (const cs of ENGINE_CASES) {
    const fails = runEngineCase(cs);
    if (!fails.length) { caseOK++; lines.push(`✓ ${cs.name}`); }
    else lines.push(`✗ ${cs.name}：${fails.join('；')}`);
  }
  let lvOK = 0;
  LEVELS.forEach((L, i) => {
    S = newGameState(i);
    let legal = true;
    for (const [sp, r, c] of SOLUTIONS[i]) {
      if (!canPlay(sp) || isStone(r, c) || entityAt(r, c)) { legal = false; break; }
      takeCard(sp);
      S.animals.push({ id: idSeq++, species: sp, r, c, satiety: 0, fat: false, fatSince: -1, dead: false });
      const res = computeResolution(S.turn);
      if (allSettled()) break; // 提前获胜则结束
      for (const id of res.flies) {                     // 与 placeCard 一致：胜利判定后才结算离开
        const a = S.animals.find(x => x.id === id);
        if (a) { a.dead = true; S.released++; }
      }
    }
    const win = allSettled();
    if (win && legal) { lvOK++; lines.push(`✓ 第 ${i + 1} 关 ${L.name}：可解`); }
    else lines.push(`✗ 第 ${i + 1} 关 ${L.name}：异常`);
  });
  S = saved;
  const head = `引擎用例 ${caseOK}/${ENGINE_CASES.length} · 关卡 ${lvOK}/${LEVELS.length}`;
  console.log(`[生态链·EcoLoop 自检] ${head}\n` + lines.join('\n'));
  showModal(`<h2>🧪 自检报告</h2><p class="tc">${head}</p>
    <p class="tc" style="font-size:12px;line-height:1.8">${lines.join('<br>')}</p>
    <div class="row"><button class="btn primary" id="mGo">开始游戏</button></div>`);
  $('mGo').onclick = () => loadLevel(lastLevel());
}

function lastLevel() {
  let i = 0;
  try { i = parseInt(localStorage.getItem('eatfly_last') || '0', 10) || 0; } catch (e) {}
  return Math.max(0, Math.min(LEVELS.length - 1, i));
}

/* ---------- 启动 ---------- */
if (new URLSearchParams(location.search).has('test')) {   // 修复：?test 无值时 get() 返回空串（恒假），v0.2 起自检从未真正触发过
  runSelfTest();
} else {
  loadLevel(lastLevel());
}
